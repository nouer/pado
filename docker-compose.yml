services:
  pado-app:
    # テスト/E2E 用: ホストへポート公開しない（ポート競合を根絶する）
    build: .
    image: "${COMPOSE_PROJECT_NAME:-pado}_app_image"
    networks:
      - pado_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./local_app:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  pado-app-public:
    # ブラウザアクセス用: ホストへポート公開する（必要なら PADO_PORT で変更）
    image: "${COMPOSE_PROJECT_NAME:-pado}_app_image"
    build: .
    ports:
      - "${PADO_PORT:-8087}:80"
    networks:
      - pado_net
    volumes:
      - ./local_app:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  pado-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    shm_size: '1gb'
    networks:
      - pado_net
    volumes:
      - ./local_app:/app/local_app
      - ./tools:/app/tools
      - ./docs:/app/docs
    depends_on:
      pado-app:
        condition: service_healthy

networks:
  pado_net:
    driver: bridge
